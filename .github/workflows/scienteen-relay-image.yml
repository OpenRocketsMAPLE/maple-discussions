name: Publish Scientific Teenager relay image

on:
  push:
    branches:
      - main
    paths:
      - scientific-teenager/**
      - .github/workflows/scienteen-relay-image.yml
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical GitHub source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image from GitHub
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --tag ttl.sh/openrockets-scienteen-relay-1571890811552014356-auto-setup:24h \
            --push \
            ./scientific-teenager
